# =============================================================================
#  example.config.yaml — MASTER REFERENCE for site configurations
# =============================================================================
#
#  What this file is
#    The canonical, fully annotated example of a site configuration. Use it as:
#      - a reference implementation of every supported field
#      - a blueprint when creating a new site or extracting a new template
#      - a schema example: the supported part is validated by a test
#        (packages/core/test/example-config.test.ts), so it cannot drift
#      - a placeholder model: every value is realistic sample content to replace
#      - a taxonomy reference for template extraction and generation tools
#
#  What it is NOT
#    A live site. Sites are discovered as sites/<id>/site.config.yaml, so this
#    file is never built or deployed. To start a real site, prefer
#      npm run saito -- create <id> --template <t> --tenant <tenant>
#    and copy only the sections you need from here.
#
#  Source of truth
#    packages/core/src/schema/site.ts       site fields (siteConfigSchema)
#    packages/core/src/schema/sections.ts   the 16 section types
#    packages/core/src/schema/theme.ts      theme tokens the renderer uses
#    packages/core/src/schema/template.ts   template manifest + website types
#    docs/CONFIGURATION.md                  human-readable reference
#    If this file and the schema disagree, the schema wins: fix this file.
#
# -----------------------------------------------------------------------------
#  FIELD LEGEND (used in the comments throughout)
# -----------------------------------------------------------------------------
#    [REQUIRED]      Validation fails without it.
#    [REQUIRED-IF]   Required only when its parent object is present.
#    [OPTIONAL]      May be omitted. The default is given as "default: …".
#    [COMPUTED]      Derived by the platform at build time. Never set by hand;
#                    listed in comments so tools know it exists.
#    [REUSABLE]      Defined once with a YAML anchor (&name) and referenced with
#                    an alias (*name). Plain anchors only: the parser is YAML 1.2
#                    and does not support "<<" merge keys.
#    [EXTENSION]     Lives in an "x-" block. Not read by the renderer; the loader
#                    silently drops unknown top-level keys. Used by designers,
#                    generators and documentation tools.
#
# -----------------------------------------------------------------------------
#  NAMING CONVENTIONS
# -----------------------------------------------------------------------------
#    Site id, tenant, section ids     kebab-case        meridian-partners, hero
#    Page slugs                       kebab-case segments joined by "/"
#                                     "index" is the homepage   about/team
#    Field names                      camelCase         primaryAction, logoText
#    Section type values              camelCase         richText, logoCloud
#    Extension blocks                 "x-" + kebab-case x-tokens, x-taxonomy
#    YAML anchors                     kebab-case, prefixed by kind
#                                     &link-…, &action-…, &image-…, &section-…
#    Asset files                      kebab-case, lowercase extensions
#                                     /images/team-ana-lopez.webp
#    Template references              <template-id>@<range>    corporate@1
#
# -----------------------------------------------------------------------------
#  COMPUTED VALUES (never set; produced from this file)
# -----------------------------------------------------------------------------
#    Page path               "index" → "/", "about/team" → "/about/team/"
#    Canonical URL           environments.<env>.url + page path
#    Indexing                seo.noindex is forced to true outside production
#                            (meta robots, robots.txt, X-Robots-Tag header)
#    Theme CSS               theme → --saito-* CSS custom properties
#    Section anchor          defaults to the section id
#    Logo text               brand.logoText defaults to `name`
#    Form action             <integrations.forms.endpoint>/v1/sites/<id>/contact
#    Public integrations     webhookUrl and notifyEmail are stripped before
#                            rendering; they never reach HTML
#    Build artifacts         dist/<env>/<id>/: HTML, sitemap.xml, robots.txt,
#                            _headers (cache + security), saito-manifest.json
#    CMS document ids        saito-<id>-settings, saito-<id>-page-<slug>
#
#  Layer precedence: template defaults < this file < content overlay
#  (sites/<id>/content/pages/*.yaml, then Sanity when enabled).
#  Merge rules: objects merge recursively, arrays replace, null deletes a key.
# =============================================================================


# =============================================================================
#  x-meta  [EXTENSION]
#  Metadata about this configuration document itself (not about the website).
# =============================================================================
x-meta:
  documentType: site-config            # site-config | template-blueprint
  referenceVersion: 1.3.0              # semver of this reference file's structure
  status: reference                    # draft | active | deprecated | reference
  maintainers:
    - platform-team@meridian.example
  lastReviewed: 2026-10-29             # ISO 8601 date


# =============================================================================
#  x-taxonomy  [EXTENSION]
#  Classification used by template extraction and generation workflows.
#  Mirrors live-sketching/taxonomy-template.md so a classified reference design
#  maps straight onto a configuration.
# =============================================================================
x-taxonomy:
  industry: professional-services      # free text, kebab-case
  subIndustry: management-consulting
  # One or more of the platform's website types (schema/template.ts):
  # landing-page, homepage, corporate, marketing, product-showcase,
  # service-business, restaurant, real-estate, portfolio, event, microsite,
  # campaign, brand
  websiteTypes: [corporate, service-business]
  visualStyle:
    primary: modern-minimal
    secondary: [editorial, trustworthy]
    notStyles: [brutalist, dark-moody]  # explicit exclusions help generators
  tone: [confident, clear, warm]
  audience:
    - mid-size company executives
    - operations and finance leaders
  conversion:
    primary: book-consultation
    secondary: [download-guide, newsletter-signup]
  positioning: premium-accessible      # budget | mid-market | premium-accessible | luxury
  maturity: established-brand          # startup | growing | established-brand


# =============================================================================
#  x-vocabulary  [EXTENSION]
#  Allowed values for x-taxonomy. Extend when an extraction needs a new value;
#  reuse before adding. Values are kebab-case. websiteTypes is not here: it is
#  the platform's fixed list in packages/core/src/schema/template.ts.
# =============================================================================
x-vocabulary:
  industries: [professional-services, food-and-beverage]
  subIndustries: [management-consulting, family-restaurant, casual-eatery, cafe]
  visualStyles:            # also used for visualStyle.notStyles
    - modern-minimal
    - editorial
    - trustworthy
    - brutalist
    - dark-moody
    - corporate
    - luxury
    - warm-food-photography
    - friendly-script-casual
    - soft-rounded-modern
    - playful-illustrated
    - organic
  tones: [confident, clear, warm, homey, cheerful, appetizing, casual]
  conversionGoals:
    - book-consultation
    - download-guide
    - newsletter-signup
    - order-online
    - reserve-table
    - view-menu
    - catering-inquiry
    - promotional-offer
  positioning: [budget, mid-market, premium-accessible, luxury]
  maturity: [startup, growing, established-brand]


# =============================================================================
#  x-components  [EXTENSION] [REUSABLE]
#  Shared fragments defined once and referenced below with aliases.
#  Anchors must be defined before they are used, so this block stays near the
#  top. The values themselves follow the real schema shapes:
#    link   { label [REQUIRED], href [REQUIRED] }
#    image  { src [REQUIRED], alt [OPTIONAL, default ""], width?, height? }
# =============================================================================
x-components:
  links:
    book: &action-book
      label: Book a consultation
      href: /contact/
    services: &link-services
      label: Services
      href: /#services
    about: &link-about
      label: About
      href: /about/
    careers: &link-careers
      label: Careers
      href: /careers/
    contact: &link-contact
      label: Contact
      href: /contact/
    guide: &action-guide
      label: Download the 2027 operations guide
      href: /guides/operations-2027.pdf

  # Business identity (name, address, phone) reused by contact, footer and SEO.
  business:
    email: &business-email hello@meridian.example
    phone: &business-phone "+1 (415) 555-0142"   # quote values with special characters
    address: &business-address 500 Market Street, Suite 1200, San Francisco, CA 94105

  images:
    hero: &image-hero
      src: /images/hero-team-workshop.webp
      alt: Consultants and client team mapping a process on a whiteboard
      width: 1600
      height: 1067
    share: &image-share
      src: /images/share-card.png
      alt: Meridian Partners logo on a navy background
      width: 1200
      height: 630

  # A whole section can be reused too: the same CTA closes several pages.
  sections:
    closing-cta: &section-closing-cta
      type: cta
      heading: Ready to simplify how your company runs?
      body: A 30-minute call is enough to see where we can help.
      primaryAction: *action-book
      secondaryAction: *action-guide
      background: primary


# =============================================================================
#  x-patterns  [EXTENSION]
#  Template capabilities seen in extracted designs that the schema cannot fully
#  express: the backlog of candidate section types and components.
#  kind:   section | component | decoration | interaction | layout
#  status: proposed (seen, not built) | planned | implemented (now a real type)
#  seenIn lists website types or industries, never business names.
#  occurrences counts distinct source designs: re-extracting one already counted
#  (as a site and later as a template) does not add to it.
# =============================================================================
x-patterns:
  media-text-split:
    kind: section
    status: implemented
    description: Heading, paragraphs and a button beside a large photo, alternating sides down the page (zig-zag).
    fields:
      heading: string
      body: richText
      image: image
      imagePosition: "start | end"
      action: link?
    nearestType: richText
    fallback: richText (photo lost), or hero with layout split when the photo is essential
    seenIn: [restaurant, cafe]
    occurrences: 2
  image-marquee:
    kind: interaction
    status: implemented
    description: Horizontally auto-scrolling, looping row of small captioned photos.
    fields:
      images: "{ image, caption?: string }[]"
      speed: "slow | normal"
    nearestType: gallery
    fallback: static gallery with captions, 4 columns
    seenIn: [restaurant]
    occurrences: 1
  svg-icon-badges:
    kind: component
    status: implemented
    description: Feature items led by an SVG icon inside a colored circular badge, each badge a different accent color.
    fields:
      icon: "icon name or SVG asset"
      badgeColor: "primary | accent | <theme color>"
    nearestType: features
    fallback: features with emoji icons
    seenIn: [restaurant]
    occurrences: 1
  category-tiles:
    kind: section
    status: proposed
    description: Grid of photo tiles, each with a title, optional subtitle and optional link (menu categories, service or event types).
    fields:
      heading: string
      intro: string?
      tiles: "{ image, title: string, subtitle?: string, href?: link }[]"
      action: link?
    nearestType: gallery
    fallback: gallery with the title and subtitle in each caption (links lost)
    seenIn: [restaurant]
    occurrences: 1
  table-reservation:
    kind: section
    status: proposed
    description: Booking widget with date, time and party-size inputs that checks availability.
    fields:
      heading: string
      provider: "opentable | resy | custom"
      providerUrl: url
      times: string[]
      maxPartySize: number
    nearestType: cta
    fallback: cta linking to the booking page or a tel link
    seenIn: [restaurant, cafe]
    occurrences: 2
  masonry-gallery:
    kind: layout
    status: implemented
    description: Photo grid with mixed tile heights (some tiles span two rows) instead of uniform crops.
    fields:
