# =============================================================================
#  IDENTITY  (validated by siteConfigSchema)
# =============================================================================

id: meridian-partners        # [REQUIRED] kebab-case; must equal the directory name sites/<id>/
tenant: meridian             # [REQUIRED] kebab-case customer id; groups sites for builds, CMS and form storage
name: Meridian Partners      # [REQUIRED] site name: <title>, JSON-LD, logo text fallback
description: >-              # [OPTIONAL] default "" — default meta description (aim for 120–160 characters)
  Operations consulting for growing companies: clearer processes, faster
  decisions and teams that scale without the chaos.
locale: en-US                # [OPTIONAL] default "en" — BCP 47 tag; also drives price and date formatting

# [REQUIRED] Template reference "<template-id>@<range>":
#   corporate@1        any 1.x.y (recommended: minor/patch updates arrive automatically)
#   landing@^2.1.0     2.1.0 or later within major 2
#   event@latest       newest version (avoid in production: majors can break overrides)
# Breaking (major) upgrades are opt-in: `saito outdated`, then `saito upgrade <id>`.
template: corporate@1


# =============================================================================
#  ENVIRONMENTS  [OPTIONAL] default {}
#  One URL per environment; sets canonical URLs and the sitemap.
#  Keys: development | staging | production. Value: { url [REQUIRED-IF] (absolute URL) }
#  Deployment credentials never go here: they live in git-ignored environments/<site>/.<env>.env files.
# =============================================================================
environments:
  development:
    url: http://localhost:4321
  staging:
    url: https://meridian-partners.staging.saito.example
  production:
    url: https://www.meridian.example


# =============================================================================
#  BRAND  [OPTIONAL] default {}
#  Files are served from sites/<id>/public/ at the site root.
# =============================================================================
brand:
  logo:                      # [OPTIONAL] image; when absent, logoText is shown
    src: /logo.svg           # [REQUIRED-IF] prefer SVG for logos
    alt: Meridian Partners   # [OPTIONAL] default "" — describe the brand, not "logo"
    width: 160               # [OPTIONAL] positive integer, prevents layout shift
    height: 40
  logoText: Meridian         # [OPTIONAL] [COMPUTED default: name]
  favicon: /favicon.svg      # [OPTIONAL] path under public/


# =============================================================================
#  THEME (design tokens the renderer uses)  [OPTIONAL] default {}
#  A partial theme deep-merged over the template's theme: set only what changes.
#  The full shape is shown here for reference. In a TEMPLATE manifest every
#  color and both fonts are [REQUIRED]; in a site config they are all optional.
#  Additional tokens (spacing, type scale, motion) live in x-tokens below.
# =============================================================================
theme:
  mode: light                # [OPTIONAL] default light — light | dark
  colors:                    # hex only (#rgb or #rrggbb), always quoted in YAML
    primary: "#1d4ed8"           # brand color: buttons, links, "primary" section backgrounds
    primaryContrast: "#ffffff"   # text on primary; keep WCAG AA contrast (4.5:1) with primary
    secondary: "#0f172a"         # "dark" section backgrounds
    accent: "#f59e0b"            # highlights, badges
    background: "#ffffff"        # page background
    surface: "#f8fafc"           # "surface" sections, cards, footer
    text: "#0f172a"              # body text
    muted: "#475569"             # secondary text; keep AA contrast with background
    border: "#e2e8f0"            # dividers, inputs
    accent2: "#10b981"           # [OPTIONAL] extra accents (badges, colour blocks); unset → accent
    accent3: "#f43f5e"           # [OPTIONAL]
    scrim: "#140f0a9e"           # [OPTIONAL] #rrggbbaa overlay on full-bleed photos; unset → black at 55%
  fonts:
    heading: Fraunces        # letters, digits and spaces only (written into CSS)
    body: Inter
    googleFonts: true        # [OPTIONAL] default true — false for system or self-hosted fonts
  radius: md                 # [OPTIONAL] default md — none | sm | md | lg | xl | 2xl | 3xl | full
  radii:                     # [OPTIONAL] per-role radius on the same scale; an unset role uses radius
    button: full             # pill buttons
    card: xl                 # 1.25rem
    image: 2xl               # 1.875rem (gallery and hero images)
    panel: 3xl               # 2.5rem (colour slabs, panels)


# =============================================================================
#  NAVIGATION  [OPTIONAL] — replaces the template navigation when present
#  links: [link] default []   cta: link [OPTIONAL]
#  Keep 3–6 top-level links; the cta is the primary conversion.
# =============================================================================
navigation:
  links:
    - *link-services
    - *link-about
    - *link-careers
    - *link-contact
  cta: *action-book


# =============================================================================
#  FOOTER  [OPTIONAL] — every key optional; merged over the template footer
# =============================================================================
footer:
  tagline: Operations consulting for companies that are growing fast.
  columns:                   # [OPTIONAL] each column: { title [REQUIRED-IF], links [REQUIRED-IF] }
    - title: Company
      links:
        - *link-about
        - *link-careers
    - title: Get in touch
      links:
        - *link-contact
        - label: hello@meridian.example
          href: mailto:hello@meridian.example
  social:                    # platform: x | facebook | instagram | linkedin | youtube | github | tiktok
    - platform: linkedin
      href: https://www.linkedin.com/company/meridian-partners-example
    - platform: youtube
      href: https://www.youtube.com/@meridian-partners-example
  legal: All rights reserved.   # rendered after "© <year> <name>." — do not repeat the © or the name


# =============================================================================
#  SEO  [OPTIONAL] — every key optional; merged over the template SEO settings
# =============================================================================
seo:
  titleTemplate: "%s | Meridian Partners"   # "%s" = page title; keep the result under ~60 characters
  defaultImage: /images/share-card.png      # share image (Open Graph / social cards), 1200×630
  twitterHandle: "@meridianpartners"
  noindex: false             # default false; [COMPUTED] forced true outside production
  schemaType: Organization   # JSON-LD type: Organization | LocalBusiness | Restaurant | Event | Person


# =============================================================================
#  INTEGRATIONS  [OPTIONAL] default {} — third-party services, each optional
# =============================================================================
integrations:
  analytics:                 # [OPTIONAL]
    provider: plausible      # [REQUIRED-IF] plausible | ga4
    id: meridian.example     # [REQUIRED-IF] Plausible domain or GA4 measurement id (G-XXXXXXX)

  # [OPTIONAL] Light commerce; checkout is always delegated. One provider:
  #   snipcart        { publicKey [REQUIRED-IF], currency [OPTIONAL] default USD (ISO 4217) }
  #   shopify         { storeDomain, storefrontToken }  — products link to their `url`
  #   commerce-layer  { organization, clientId }        — products link to their `url`
  commerce:
    provider: snipcart
    publicKey: pk_test_placeholder_0000000000   # public by design; never put secret keys here
    currency: USD

  forms:                     # [OPTIONAL] enables contact forms through apps/api
    endpoint: https://api.meridian.example          # [REQUIRED-IF] absolute URL of the forms API
    webhookUrl: https://hooks.meridian.example/leads # [OPTIONAL] server-side only, never rendered
    notifyEmail: leads@meridian.example              # [OPTIONAL] server-side only, never rendered


# =============================================================================
#  PAGES  [OPTIONAL] default {} — per-page overrides, keyed by page slug
# -----------------------------------------------------------------------------
#  Page fields:
#    enabled      [OPTIONAL] default true — false drops a template page
#    title        [OPTIONAL] for template pages; [REQUIRED] for new pages
#    description  [OPTIONAL] page meta description
#    sections     [OPTIONAL] map keyed by SECTION ID (never array position):
#                   <id>: { … }              deep-merge into the template section
#                   <id>: false              remove the template section
#                   <new-id>: { type, … }    add a section (type is [REQUIRED])
#    order        [OPTIONAL] section ids to put first; the rest keep template order
#
#  Every section accepts:
#    id           [COMPUTED] taken from the map key
#    type         [REQUIRED] for new sections; inherited for template sections
#    anchor       [OPTIONAL] HTML anchor, default: the section id
#    background   [OPTIONAL] default — default | surface | primary | dark
#
#  The corporate@1 template provides these pages and section ids:
#    index: hero, stats, services, testimonials, cta
#    about: intro, team     services: list, faq     contact: contact
# =============================================================================
pages:

  # --- Template page: merge, remove, add and reorder ---------------------------
  index:
    title: Home
    description: Operations consulting that makes growing companies simpler to run.
    sections:
      hero:                                  # merge into the template's "hero"
        layout: split                        # centered | split | image-background
        eyebrow: Operations consulting
        heading: Grow without the growing pains
        subheading: >-
          We redesign the processes, tools and team structures that slow
          fast-growing companies down.
        primaryAction: *action-book
        secondaryAction: *link-services
        image: *image-hero
      stats:
        items:                               # arrays REPLACE the template list entirely
          - { value: "120+", label: Companies supported }
          - { value: "32%", label: Average cost reduction }
          - { value: "9 weeks", label: Typical engagement }
      testimonials: false                    # remove: no approved client quotes yet
      clients:                               # new id + type → new section
        type: logoCloud
        heading: Trusted by teams at
        logos:
          - { name: Harbor Logistics, src: /images/clients/harbor-logistics.svg }
          - { name: Pinecrest Health, src: /images/clients/pinecrest-health.svg }
          - { name: Atlas Robotics, src: /images/clients/atlas-robotics.svg }
      cta: *section-closing-cta              # [REUSABLE] whole section from x-components
    order: [hero, clients, stats]            # these first; the rest keep template order

  # --- Template page: light touch -----------------------------------------------
  about:
    enabled: true                            # set to false to drop this template page
    sections:
      intro:
        heading: Why we started Meridian
        body: |-
          We spent a decade inside companies that grew faster than their
          processes. **Meridian exists so growth feels like progress, not chaos.**

          Read about our approach in the [operations guide](/guides/operations-2027.pdf).

  # --- New page (not in the template): title and typed sections required ---------
  careers:
    title: Careers
    description: Join a small team that helps companies run better.
    sections:
      intro:
        type: hero
        heading: Do the best work of your career
        subheading: Remote-first, four-day weeks in August, and clients who listen.
        primaryAction: { label: See open roles, href: "#roles" }
      roles:
        type: richText
        anchor: roles
        heading: Open roles
        body: |-
          **Senior Operations Consultant** — Remote (US), full time.

          **Process Analyst** — San Francisco or remote, full time.
      closing: *section-closing-cta

  # --- REFERENCE ONLY: section catalog --------------------------------------------
  # One example of every section type, with every field. Delete this page when
  # copying the file into a real site. The test checks that it covers every
  # section type in the schema, so it grows when a new type is added.
  reference/section-catalog:
    title: Section catalog
    description: Reference examples of every section type.
    sections:

      catalog-hero:
        type: hero
        layout: centered                     # centered | split | image-background
        eyebrow: Section catalog             # [OPTIONAL]
        heading: Every section type, one page  # [REQUIRED]
        subheading: Copy any block below into a page override.
        primaryAction: *action-book          # [OPTIONAL] link
        secondaryAction: *link-services      # [OPTIONAL] link
        image: *image-hero                   # [OPTIONAL] image

      catalog-features:
        type: features
        heading: What we do
        intro: "Three services, one goal: a company that runs itself."   # quote text containing ": "
        columns: 3                           # 2 | 3 | 4, default 3
        iconStyle: emoji                     # emoji | badge, default emoji; badge: icon is a name from the shared icon set (pot, heart, home, family, leaf, mail, …) in a round accent badge
        dividers: false                      # [OPTIONAL] default false; true: centred columns with thin rules instead of cards
        items:                               # [REQUIRED] at least 1
          - icon: "🧭"                       # [OPTIONAL] short glyph rendered as text (emoji or symbol), decorative
            title: Process design            # [REQUIRED]
            description: Map how work really flows, then remove the friction.
          - icon: "🧩"
            title: Systems and tooling
            description: Pick and connect the tools your team will actually use.
          - icon: "👥"
            title: Team structure
            description: Clear roles and handoffs as you scale past 50 people.

      catalog-stats:
        type: stats
        heading: Results
        items:                               # [REQUIRED] each { value, label }, quote numeric-looking values
          - { value: "4.9/5", label: Client satisfaction }
          - { value: "2016", label: Founded }

      catalog-logos:
        type: logoCloud
        heading: Featured in
        logos:                               # [REQUIRED] each { name [REQUIRED], src?, href? }
          - { name: Operations Weekly, href: https://example.com/ops-weekly }
          - { name: Growth Review, src: /images/press/growth-review.svg }

      catalog-testimonials:
        type: testimonials
        heading: What clients say
        items:                               # [REQUIRED] each { quote, author, role?, avatar? }
          - quote: They found three weeks of waste in our monthly close.
            author: Dana Whitfield
            role: CFO, Harbor Logistics
            avatar: { src: /images/avatars/dana-whitfield.webp, alt: Dana Whitfield }

      catalog-pricing:
        type: pricing
        heading: Engagements
        intro: Fixed fees, agreed before we start.
        plans:                               # [REQUIRED] at least 1
          - name: Diagnostic                 # [REQUIRED]
            price: $4,500                    # [REQUIRED] display string (formatted by you)
            period: one-off                  # [OPTIONAL]
            description: Two-week assessment with a prioritized roadmap.
            features: [Stakeholder interviews, Process maps, Roadmap workshop]
            action: *action-book             # [REQUIRED] link
          - name: Transformation
            price: $18,000
            period: per quarter
            features: [Everything in Diagnostic, Hands-on implementation, Weekly check-ins]
            action: *action-book
            highlighted: true                # [OPTIONAL] default false — visually emphasized plan

      catalog-faq:
        type: faq
        heading: Questions
        items:                               # [REQUIRED] each { question, answer }
          - question: How long is a typical engagement?
            answer: Most projects run eight to twelve weeks.

      catalog-cta:
        type: cta
        heading: Let's talk                  # [REQUIRED]
        body: No slides, no sales pitch.     # [OPTIONAL]
        primaryAction: *action-book          # [REQUIRED]
        secondaryAction: *action-guide       # [OPTIONAL]
        layout: band                         # band | photo-band, default band
        # image: { src: /images/cta-band.webp, alt: Team at work }   # [REQUIRED for photo-band] photo under the scrim, content in a white card

      catalog-rich-text:
        type: richText
        heading: Our approach
        width: narrow                        # narrow | wide, default narrow (ignored with image)
        image: { src: /images/approach.webp, alt: Workshop whiteboard, width: 800, height: 600 }   # [OPTIONAL] photo beside the text
        imagePosition: end                   # start | end, default end; stacked below 821px
        action: *action-book                 # [OPTIONAL] button under the text
        slab: accent                         # [OPTIONAL] accent | accent2 | accent3 | primary — colour block behind the photo
        # [REQUIRED] paragraphs separated by blank lines; supports **bold**,
        # *italic* and [links](https://…). Raw HTML is escaped.
        body: |-
          We start with **how work actually happens**, not the org chart.

          Then we change *one thing at a time* and measure it.

      catalog-gallery:
        type: gallery
        heading: Workshops
        columns: 3                           # 2 | 3 | 4, default 3
        layout: grid                         # grid | marquee | masonry, default grid
        action: { label: See all photos, href: /gallery/ }   # [OPTIONAL] button beside the heading
        images:                              # [REQUIRED] image + caption? + span?
          - { src: /images/gallery/workshop-01.webp, alt: Team sorting sticky notes, caption: Discovery workshop, span: tall }   # span: tall → two rows in masonry
          - { src: /images/gallery/workshop-02.webp, alt: Consultant presenting a process map }

      catalog-team:
        type: team
        heading: Leadership
        intro: Operators first, consultants second.
        members:                             # [REQUIRED] each { name, role?, photo?, bio? }
          - name: Ana López
            role: Managing Partner
            photo: { src: /images/team/ana-lopez.webp, alt: Ana López }
            bio: Former COO of two venture-backed logistics companies.

      catalog-menu:                          # for restaurants and cafés
        type: menu
        heading: Workshop catering
        intro: Served at all on-site sessions.
        currency: USD                        # ISO 4217, default USD
        categories:                          # [REQUIRED] each { name, items }
          - name: Breakfast
            items:
              - id: granola-bowl             # [OPTIONAL] stable id; required for online ordering
                name: Granola bowl           # [REQUIRED]
                description: Yogurt, seasonal fruit, honey.
                price: 9.5                   # [REQUIRED] number, not a string
                tags: [vegetarian]           # [OPTIONAL] default []
                orderable: false             # [OPTIONAL] default false; true adds a cart button (commerce)

      catalog-products:                      # catalogue items; checkout via commerce provider or url
        type: products
        heading: Guides and templates
        currency: USD
        items:                               # [REQUIRED] each { id, name, price, … }
          - id: ops-playbook                 # [REQUIRED] stable id
            name: Operations playbook        # [REQUIRED]
            description: 80 pages of templates and checklists.
            price: 49                        # [REQUIRED] number
            image: { src: /images/products/ops-playbook.webp, alt: Cover of the operations playbook }
            url: https://shop.meridian.example/ops-playbook   # [OPTIONAL] used without a cart provider

      catalog-contact:
        type: contact
        heading: Contact us
        intro: We reply within one business day.
        email: *business-email               # [OPTIONAL] valid email
        phone: *business-phone               # [OPTIONAL]
        address: *business-address           # [OPTIONAL]
        hours:                               # [OPTIONAL] default [] — each { days, hours }
          - { days: Monday–Friday, hours: 8:00–18:00 PT }
        mapEmbedUrl: https://www.google.com/maps/embed?pb=placeholder   # [OPTIONAL] absolute URL
        form:                                # [OPTIONAL] needs integrations.forms to submit
          enabled: true                      # default true
          submitLabel: Send message          # [OPTIONAL] unset → the locale's label ("Send message", "Enviar mensaje")
          successMessage: Thanks, we will reply within one business day.
        # image, imagePosition, action, slab   # [OPTIONAL] as on richText: photo beside the details

      catalog-schedule:                      # for events and programs
        type: schedule
        heading: Operations Summit agenda
        intro: One day, three tracks.
        days:                                # [REQUIRED] each { label, items }
          - label: Thursday, March 11
            items:                           # each { time, title, speaker?, description? }
              - time: "09:00"
                title: Keynote — Scaling without chaos
                speaker: Ana López
                description: What breaks first when a company doubles.

      catalog-countdown:                     # for launches and events
        type: countdown
        heading: Operations Summit starts in # [REQUIRED]
        target: 2027-03-11T09:00:00-08:00    # [REQUIRED] ISO 8601 date-time WITH offset
        expiredText: The summit is live!     # [OPTIONAL] unset → the locale's text ("It has started!", "¡Ya comenzó!")
        action: { label: Get tickets, href: https://tickets.meridian.example }   # [OPTIONAL]
        background: dark

      catalog-specials:                      # a daily offer: dish names under one shared price
        type: specials
        heading: Lunch of the day            # [REQUIRED]
        intro: Weekdays 11:00–15:00, drink and dessert included.
        price: $14                           # [REQUIRED] display string (formatted by you)
        priceNote: per plate                 # [OPTIONAL]
        badge: true                          # [OPTIONAL] default true — price in a rotated star badge; false shows it as text
        items: [Roast chicken, Vegetable curry, Grilled salmon]   # [REQUIRED] at least 1
        images:                              # [OPTIONAL] up to 3, shown as a collage
          - { src: /images/specials/lunch-01.webp, alt: Lunch table with several dishes }
          - { src: /images/specials/lunch-02.webp, alt: Plate of roast chicken }
          - { src: /images/specials/lunch-03.webp, alt: Bowl of vegetable curry }
        action: { label: See the menu, href: /menu/ }   # [OPTIONAL]


# =============================================================================
#  x-tokens  [EXTENSION]
#  Design tokens beyond `theme`, in the Design Tokens Community Group (DTCG)
#  format ($type / $value) so design tools and token pipelines can read them.
#  The renderer only uses `theme`; keep these consistent with it.
# =============================================================================
x-tokens:
  spacing:
    xs:  { $type: dimension, $value: 0.25rem }
    sm:  { $type: dimension, $value: 0.5rem }
    md:  { $type: dimension, $value: 1rem }
    lg:  { $type: dimension, $value: 2rem }
    xl:  { $type: dimension, $value: 4rem }
    section: { $type: dimension, $value: 6rem }   # vertical rhythm between sections
  fontSize:
    body:    { $type: dimension, $value: 1rem }
    lead:    { $type: dimension, $value: 1.25rem }
    h3:      { $type: dimension, $value: 1.5rem }
    h2:      { $type: dimension, $value: 2.25rem }
    h1:      { $type: dimension, $value: 3.5rem }
  lineHeight:
    body:    { $type: number, $value: 1.6 }
    heading: { $type: number, $value: 1.15 }
  shadow:
    card:
      $type: shadow
      $value: { color: "#0f172a1a", offsetX: 0px, offsetY: 4px, blur: 16px, spread: 0px }
  motion:
    fast:   { $type: duration, $value: 150ms }
    base:   { $type: duration, $value: 250ms }
    easing: { $type: cubicBezier, $value: [0.2, 0, 0, 1] }
  breakpoint:                       # mobile-first min-widths
    sm: { $type: dimension, $value: 640px }
    md: { $type: dimension, $value: 768px }
    lg: { $type: dimension, $value: 1024px }
    xl: { $type: dimension, $value: 1280px }


# =============================================================================
#  x-assets  [EXTENSION]
#  Conventions for files in sites/<id>/public/ (served at the site root).
# =============================================================================
x-assets:
  root: public/                      # maps to "/" on the live site
  directories:
    images: /images/                 # photos, illustrations, section images
    clients: /images/clients/        # logo cloud
    team: /images/team/
    downloads: /guides/              # PDFs and other files
  formats:
    logo: svg                        # vector for crisp scaling
    photo: [avif, webp]              # modern formats; keep a JPEG only if required
    favicon: svg
  imageSizes:                        # recommended pixel sizes
    hero: 1600x1067
    share: 1200x630                  # Open Graph / social cards
    avatar: 256x256
    gallery: 1200x800
  rules:
    - every content image needs meaningful alt text; decorative images use alt ""
    - always set width and height to prevent layout shift
    - no text baked into images (not translatable, not accessible)
    - only assets you have rights to; record the source of stock images


# =============================================================================
#  x-content  [EXTENSION]
#  Where content lives and who owns it — guidance for editors and generators.
# =============================================================================
x-content:
  sources:                           # merged in this order; later wins
    - template defaults              # packages/templates/src/<template>/vN.ts
    - this file                      # settings and structure, reviewed in PRs
    - content/pages/*.yaml           # long-form copy, same shape as pages.<slug>
    - sanity                         # editor-managed copy when SAITO_CONTENT_SOURCE=sanity
  ownership:
    developers: [template, theme, integrations, environments, page structure]
    editors: [section copy, images, navigation labels, SEO text]
  placeholderPolicy: replace every sample value before production; keep ids stable


# =============================================================================
#  x-deployment  [EXTENSION] — documentation only
#  Code and YAML changes deploy from a machine: ./deploy.sh loads
#  environments/<site>/.<env>.env and uploads with scripts/deploy.sh. Sanity
#  publishes rebuild the site through its Cloudflare Pages deploy hook.
#  Nothing here is read by the CLI; it records the intended setup for this site.
# =============================================================================
x-deployment:
  provider: cloudflare-pages         # DEPLOY_PROVIDER in the env file: cloudflare-pages | netlify | s3-cloudfront
  environments:
    staging:
      trigger: ./deploy.sh staging <site>, or Sanity publish to the staging dataset (deploy hook, branch staging)
      approval: none
      indexable: false
    production:
      trigger: ./deploy.sh production <site>, or Sanity publish to the production dataset (deploy hook, branch main)
      approval: typed confirmation in ./deploy.sh (or --yes)
      indexable: true
  contentSource: local               # SAITO_CONTENT_SOURCE: local | sanity (dataset = environment name); Pages projects use sanity
  caching:                           # [COMPUTED] written to _headers by `saito build`
    assets: public, max-age=31536000, immutable
    html: public, max-age=0, s-maxage=3600, stale-while-revalidate=86400


# =============================================================================
#  x-extensions  [EXTENSION]
#  How to extend the configuration without breaking validation.
# =============================================================================
x-extensions:
  customKeys: >-
    Add tool-specific data only in top-level "x-" blocks (kebab-case). They are
    ignored by the renderer and dropped by the loader, so they can never break
    a build. Never add unknown fields inside sections or other schema objects:
    they are silently dropped (a misspelled field is lost without an error).
    Unknown section types and unknown section ids without a type do fail.
  newSectionType: >-
    Requires development in four places: the zod schema
    (packages/core/src/schema/sections.ts), an Astro component registered in
    sectionComponents, the Sanity schema (apps/studio/schemaTypes) and the
    table in docs/CONFIGURATION.md. Then add an example to the section catalog
    above.
  newTemplate: >-
    defineTemplate(manifest) in packages/templates/src/<id>/v1.ts, registered
    in packages/templates/src/index.ts. Use x-taxonomy from this file to
    describe the template's industry and style.
  breakingChanges: >-
    Ship a new template major with a TemplateMigration; sites move with
    `saito upgrade <id>`, which validates before writing.
