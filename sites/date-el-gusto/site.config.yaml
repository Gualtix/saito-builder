# Date El Gusto — family Guatemalan kitchen, showcase site (tenant: date-el-gusto)
# Content from live-sketching/eatery-cafe/tangerine/tangerine-web-site/ (fictional, as in the prototype).

id: date-el-gusto
tenant: date-el-gusto
name: Date El Gusto
description: &description >-
  Cocina guatemalteca casera, hecha con cariño. Pide a domicilio, reserva tu mesa o
  celebra con nuestro servicio de catering.
locale: es-GT
template: family-kitchen@1

environments:
  development:
    url: http://localhost:4321
  staging:
    url: https://staging.saito-date-el-gusto.pages.dev
  production:
    url: https://saito-date-el-gusto.pages.dev

brand:
  # The header shows the logo instead of the name text, so the "Date El Gusto" wordmark is not rendered.
  logo: { src: /images/logo.svg, alt: Date El Gusto, width: 32, height: 32 }
  favicon: /favicon.svg
  # Installable app; the files live in public/ (manifest.webmanifest, sw.js, offline.html, icons/). The splash
  # list matches the sizes in icons/splash/.
  pwa:
    themeColor: "#E99B3F"
    appleTouchIcon: /icons/apple-touch-icon.png
    splash:
      - { href: /icons/splash/splash-440x956@3x.png, media: "(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" }
      - { href: /icons/splash/splash-420x912@3x.png, media: "(device-width: 420px) and (device-height: 912px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" }
      - { href: /icons/splash/splash-402x874@3x.png, media: "(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" }
      - { href: /icons/splash/splash-430x932@3x.png, media: "(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" }
      - { href: /icons/splash/splash-393x852@3x.png, media: "(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" }
      - { href: /icons/splash/splash-390x844@3x.png, media: "(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" }
      - { href: /icons/splash/splash-428x926@3x.png, media: "(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" }
      - { href: /icons/splash/splash-375x812@3x.png, media: "(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" }
      - { href: /icons/splash/splash-414x896@3x.png, media: "(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" }
      - { href: /icons/splash/splash-414x896@2x.png, media: "(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" }
      - { href: /icons/splash/splash-375x667@2x.png, media: "(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" }

seo:
  noindex: true                 # showcase only: noindex in every environment, production included
  defaultImage: /images/share.jpg   # JPEG, not WebP: some link-preview crawlers skip WebP

footer:
  tagline: "Ciudad Vieja, Sacatepéquez, Guatemala · +502 4539 3659"
  legal: Restaurante Familiar. Prototipo con contenido ficticio.   # renderer prefixes "© <year> <name>."

integrations:
  commerce:                   # orders go to WhatsApp; the number is public by design
    provider: whatsapp
    phone: "+502 4539 3659"
    currency: GTQ
    orderIdPrefix: DG
    maxQty: 20
    location: { enabled: true, center: [14.523, -90.759], zoom: 16 }

pages:
  index:
    description: *description
    sections:
      hero:
        heading: Date El Gusto
        subheading: Auténtica cocina chapina de familia. A domicilio y para llevar · pedidos por WhatsApp.
        image: { src: /images/hero.webp, alt: Platillo casero servido en la mesa, width: 1800, height: 1200 }

      specials:
        # Copy, price and the lunch list come from the template; only the collage is local (tall photo first).
        images:
          - { src: /images/specials-lunch-table.webp, alt: Mesa con platillos variados del almuerzo, width: 600, height: 700 }
          - { src: /images/specials-ejotes-arroz.webp, alt: "Plato con ejotes, arroz y vegetales", width: 500, height: 330 }
          - { src: /images/specials-bowl.webp, alt: Bowl con proteína y vegetales frescos, width: 500, height: 330 }

      featured-dishes:
        images:
          - { src: /images/featured-albondigas.webp, alt: Albóndigas en salsa sobre hojas verdes, caption: Albóndigas en salsa, width: 300, height: 220 }
          - { src: /images/featured-costillas.webp, alt: Costillas BBQ con vegetales, caption: Costillas BBQ, width: 300, height: 220 }
          - { src: /images/featured-pinchos.webp, alt: Pinchos mixtos a la parrilla, caption: Pinchos mixtos, width: 300, height: 220 }
          - { src: /images/featured-churrasco.webp, alt: Churrasco con papas fritas, caption: Churrasco chapín, width: 300, height: 220 }
          - { src: /images/featured-cerdo-pina.webp, alt: Lomo de cerdo con piña, caption: Cerdo con piña, width: 300, height: 220 }
          - { src: /images/featured-salmon.webp, alt: Filete de salmón con limón, caption: Salmón al limón, width: 300, height: 220 }
          - { src: /images/featured-ensalada.webp, alt: Ensalada fresca con aguacate, caption: Ensalada de la casa, width: 300, height: 220 }
          - { src: /images/featured-pastel.webp, alt: Pastel de frambuesa, caption: Pastel de frutos rojos, width: 300, height: 220 }

      about:
        body: |-
          Bienvenidos a nuestro restaurante familiar de cocina guatemalteca, donde te invitamos a saborear los sabores más cálidos de nuestra tierra. Nuestro compromiso con la calidad y la tradición hace que cada plato esté preparado con esmero, con recetas de toda la vida e ingredientes frescos.

          Acompáñanos a celebrar la calidez de la familia, la riqueza de la cultura y el placer de la comida chapina.
        image: { src: /images/about-interior.webp, alt: Interior cálido del restaurante con mesas de madera, width: 900, height: 675 }

      flavors:
        heading: Sabores de Guatemala
        body: |-
          Nos enorgullece preparar los platillos vibrantes y diversos de nuestras tradiciones culinarias. Cada bocado es un viaje al corazón de Guatemala: caldos humeantes, carnes a las brasas, salsas de recado y tortillas recién hechas.

          Ven a disfrutar estos sabores de siempre, servidos como se merecen: a tu mesa.
        image: { src: /images/flavors-parrillada.webp, alt: Parrillada de carnes y verduras asadas, width: 900, height: 675 }

      menu:
        # The full product list from data.js: arrays replace, and the site owns its catalogue.
        categories:
          - name: Entradas
            items:
              - { id: tostadas, name: Tostadas chapinas, description: "Tres tostadas crujientes con guacamol, frijol volteado y salsa de tomate.", price: 35, orderable: true, image: { src: /images/menu-tostadas.webp, alt: Tostadas chapinas, width: 600, height: 450 }, ingredients: [Guacamol, Frijol volteado, Salsa de tomate, Cebolla, Queso seco, Perejil] }
              - { id: ceviche, name: Ceviche de camarón, description: "Camarón marinado en limón con tomate, cebolla, cilantro y aguacate.", price: 70, orderable: true, image: { src: /images/menu-ceviche.webp, alt: Ceviche de camarón, width: 600, height: 450 }, ingredients: [Tomate, Cebolla, Cilantro, Aguacate, Chile] }
          - name: Platos fuertes
            items:
              - { id: pepian, name: Pepián de pollo, description: "Recado tostado de semillas y chiles con pollo, güisquil y papa. Con arroz.", price: 85, orderable: true, image: { src: /images/menu-pepian.webp, alt: Pepián de pollo, width: 600, height: 450 }, ingredients: [Güisquil, Papa, Ejotes, Arroz, Tortillas] }
              - { id: jocon, name: Jocón con arroz, description: "Pollo en recado verde de miltomate y cilantro, servido con arroz.", price: 80, orderable: true, image: { src: /images/menu-jocon.webp, alt: Jocón con arroz, width: 600, height: 450 }, ingredients: [Cebolla, Cilantro, Arroz, Tortillas] }
              - { id: churrasco, name: Churrasco chapín, description: "Puyazo a las brasas con chirmol, frijoles, guacamol y cebollín asado.", price: 110, orderable: true, image: { src: /images/menu-churrasco.webp, alt: Churrasco chapín, width: 600, height: 450 }, ingredients: [Chirmol, Frijoles, Guacamol, Cebollín, Chorizo, Tortillas] }
              - { id: costillas, name: Costillas BBQ, description: "Costillas de cerdo glaseadas, con papas y ensalada de la casa.", price: 120, orderable: true, image: { src: /images/menu-costillas.webp, alt: Costillas BBQ, width: 600, height: 450 }, ingredients: [Salsa BBQ, Papas, Ensalada, Cebolla morada] }
          - name: Postres
            items:
              - { id: rellenitos, name: Rellenitos de plátano, description: "Plátano maduro relleno de frijol dulce con chocolate y canela.", price: 30, orderable: true, image: { src: /images/menu-rellenitos.webp, alt: Rellenitos de plátano, width: 600, height: 450 }, ingredients: [Azúcar, Canela] }
              - { id: pastel, name: Pastel de frutos rojos, description: "Bizcocho suave con crema y frambuesas frescas.", price: 35, orderable: true, image: { src: /images/menu-pastel.webp, alt: Pastel de frutos rojos, width: 600, height: 450 }, ingredients: [Crema, Frambuesas] }
          - name: Bebidas
            items:
              - { id: horchata, name: Horchata, description: "Bebida fría de arroz con canela, hecha en casa.", price: 18, orderable: true, image: { src: /images/menu-horchata.webp, alt: Horchata, width: 600, height: 450 }, ingredients: [Hielo, Canela] }

      # Hidden in the prototype.
      reserve: false
      reviews: false
      catering: false

      gallery:
        # Prototype crops kept (600×400 and tall 600×800) for the masonry layout.
        images:
          - { src: /images/gallery-salmon.webp, alt: Salmón a la plancha, width: 600, height: 400 }
          - { span: tall, src: /images/gallery-cerdo-pina.webp, alt: Cerdo asado con piña, width: 600, height: 800 }
          - { src: /images/gallery-pollo.webp, alt: Pollo asado con ensalada, width: 600, height: 400 }
          - { span: tall, src: /images/gallery-pinchos.webp, alt: Pinchos a la parrilla, width: 600, height: 800 }
          - { src: /images/gallery-albondigas.webp, alt: Albóndigas con salsa, width: 600, height: 400 }
          - { src: /images/gallery-churrasco.webp, alt: Churrasco con papas, width: 600, height: 400 }

      order:
        image: { src: /images/order-band.webp, alt: "", width: 1600, height: 1067 }

      visit:
        image: { src: /images/visit-ensalada.webp, alt: Ensalada colorida con aguacate y garbanzos, width: 900, height: 675 }
        address: Ciudad Vieja, Sacatepéquez, Guatemala
        phone: "+502 4539 3659"
        hours:                  # one row per day, as in the prototype
          - { days: Lunes, hours: Cerrado }
          - { days: Martes, hours: "11:00 - 21:00" }
          - { days: Miércoles, hours: "11:00 - 21:00" }
          - { days: Jueves, hours: "11:00 - 21:00" }
          - { days: Viernes, hours: "11:00 - 22:00" }
          - { days: Sábado, hours: "11:00 - 22:00" }
          - { days: Domingo, hours: "11:00 - 20:00" }
