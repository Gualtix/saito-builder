title: About Acme
description: Our history, values and leadership team.
sections:
  intro:
    heading: Twenty-five years of engineering
    body: |
      Acme was founded in 1998 by three engineers who believed industrial projects could be delivered **on time and on budget**.

      Today we are a team of 300 specialists working across energy, water and manufacturing. Read more about our approach in our [project portfolio](/services/).
  team:
    members:
      - name: Dana Whitfield
        role: Chief Executive Officer
        bio: Leads Acme's strategy and client partnerships.
      - name: Ravi Menon
        role: Chief Technology Officer
        bio: Oversees engineering standards and innovation.
      - name: Grace Okafor
        role: Director of Operations
        bio: Keeps 40+ concurrent projects running smoothly.
