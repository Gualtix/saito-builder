title: About Acme
description: Our history, values and leadership team.
sections:
  intro:
    heading: Twenty-five years of engineering
    body: |
      Acme was founded in 1998 by three engineers who believed industrial projects could be delivered **on time and on budget**.

      Today we are a team of 300 specialists working across energy, water and manufacturing. Read more about our approach in our [project portfolio](/services/).
  values:
    type: features
    heading: What we stand for
    items:
      - icon: "🦺"
        title: Safety first
        description: Every site, every shift. No schedule is worth an incident.
      - icon: "📏"
        title: Honest numbers
        description: Estimates we can defend, and early warnings when things change.
      - icon: "🌱"
        title: Built to last
        description: We design for the next 40 years of operation, not just handover day.
  team:
    members:
      - name: Dana Whitfield
        role: Chief Executive Officer
        bio: Leads Acme's strategy and client partnerships.
        photo:
          src: https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&w=320&h=320&q=75
          alt: Portrait of Dana Whitfield
      - name: Ravi Menon
        role: Chief Technology Officer
        bio: Oversees engineering standards and innovation.
        photo:
          src: https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=320&h=320&q=75
          alt: Portrait of Ravi Menon
      - name: Grace Okafor
        role: Director of Operations
        bio: Keeps 40+ concurrent projects running smoothly.
        photo:
          src: https://images.unsplash.com/photo-1580489944761-15a19d654956?auto=format&fit=crop&w=320&h=320&q=75
          alt: Portrait of Grace Okafor
      - name: Marco Ferri
        role: Head of Engineering
        bio: Signs off every design before it reaches site.
        photo:
          src: https://images.unsplash.com/photo-1560250097-0b93528c311a?auto=format&fit=crop&w=320&h=320&q=75
          alt: Portrait of Marco Ferri
  facilities:
    type: gallery
    heading: Where we work
    columns: 3
    images:
      - src: https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=800&h=600&q=75
        alt: Glass office towers seen from street level
        caption: Head office, Springfield
        width: 800
        height: 600
      - src: https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?auto=format&fit=crop&w=800&h=600&q=75
        alt: Engineer at a laptop surrounded by test equipment
        caption: Automation test lab
        width: 800
        height: 600
      - src: https://images.unsplash.com/photo-1504917595217-d4dc5ebe6122?auto=format&fit=crop&w=800&h=600&q=75
        alt: Sparks flying from an angle grinder in a workshop
        caption: Fabrication workshop
        width: 800
        height: 600
  join:
    type: cta
    heading: Want to build with us?
    primaryAction:
      label: See open roles
      href: /careers/
    background: surface
order: [intro, values, team, facilities, join]
